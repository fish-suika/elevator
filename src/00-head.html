<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>エレベーター係</title>
<style>
  /* --u は「枠の幅の 1/100」（JS が入れる）。スマホでも PC の 9:16 枠でも同じ比の見た目になる */
  :root{--u:3.75px;--ink:#f2efe8;--amber:#ffb23e;--bg:#0c0e12;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{-webkit-touch-callout:none;width:100%;height:100%;overflow:hidden;background:#020305;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  button{font-family:var(--jp);touch-action:manipulation;cursor:pointer}

  /* ---- 縦長 9:16 の枠。PC は高さいっぱいの 9:16 を中央、スマホ(縦)は全面 ---- */
  #stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:var(--bg);
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 60px rgba(0,0,0,.8)}
  #view{position:absolute;left:0;right:0;top:0;height:62%;overflow:hidden}
  #view canvas{display:block;width:100%;height:100%}

  /* ---- 上部：現在階 ---- */
  #top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + var(--u)*3);z-index:5;display:flex;justify-content:center;pointer-events:none}
  #cur{display:flex;align-items:center;gap:calc(var(--u)*2.5);padding:calc(var(--u)*1.6) calc(var(--u)*5);border-radius:calc(var(--u)*6);
    background:rgba(8,10,14,.72);border:1px solid rgba(255,255,255,.18);font-size:calc(var(--u)*5);letter-spacing:.08em}
  #cur b{font-size:calc(var(--u)*8);color:var(--amber);font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center;text-shadow:0 0 12px rgba(255,170,50,.6)}
  #arrow{width:calc(var(--u)*5);font-size:calc(var(--u)*6);color:var(--amber);text-align:center}
  #arrow.on{animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #msg{position:absolute;left:0;right:0;top:calc(var(--u)*92);z-index:5;text-align:center;font-size:calc(var(--u)*4);letter-spacing:.1em;
    opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 2px 10px #000}
  #msg.on{opacity:1}

  /* ---- 下部操作盤 ---- */
  #panel{position:absolute;left:0;right:0;bottom:0;height:38%;z-index:6;display:flex;gap:calc(var(--u)*3);
    padding:calc(var(--u)*3) calc(var(--u)*4) calc(env(safe-area-inset-bottom) + var(--u)*4);
    background:linear-gradient(to bottom,#1b1f27,#0e1116);border-top:2px solid #3a4150}
  #grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:calc(var(--u)*2)}
  .fb{border:2px solid #aab3c2;border-radius:calc(var(--u)*3);background:radial-gradient(circle at 50% 35%,#566073,#2a303b);color:var(--ink);
    font-size:calc(var(--u)*5.6);font-weight:700;letter-spacing:.04em;box-shadow:0 3px 0 #090b0f}
  .fb:active{transform:translateY(2px);box-shadow:0 1px 0 #090b0f}
  .fb.lit{border-color:var(--amber);color:var(--amber);background:radial-gradient(circle at 50% 35%,#6b4a1c,#3a2810);box-shadow:0 0 14px rgba(255,170,50,.7),0 3px 0 #090b0f}
  .fb.here{color:var(--amber)}
  .fb.off{opacity:.28;border-color:#555;pointer-events:none;box-shadow:none}

  /* ---- Phase 2：スコア・台詞・リザルト ---- */
  .stat{position:absolute;top:calc(env(safe-area-inset-top) + var(--u)*3);z-index:5;pointer-events:none;line-height:1.15;text-shadow:0 2px 8px #000}
  .stat small{display:block;font-size:calc(var(--u)*3);letter-spacing:.1em;opacity:.8}
  .stat b{font-size:calc(var(--u)*6);color:var(--amber);font-variant-numeric:tabular-nums}
  #statL{left:calc(var(--u)*3)} #statR{right:calc(var(--u)*3);text-align:right}
  #memo{position:absolute;left:calc(var(--u)*3);top:calc(env(safe-area-inset-top) + var(--u)*15);z-index:5;pointer-events:none;display:none;flex-direction:column;gap:calc(var(--u)*1);text-shadow:0 2px 8px #000}
  #memo.on{display:flex}
  #memo .m{display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*0.5) calc(var(--u)*2.2);border-radius:calc(var(--u)*3);background:rgba(8,10,14,.72);border:1px solid rgba(255,255,255,.18);font-size:calc(var(--u)*3.8);font-weight:700;font-variant-numeric:tabular-nums}
  #memo .m i{width:calc(var(--u)*3);height:calc(var(--u)*3);border-radius:50%;display:block;border:1px solid rgba(255,255,255,.5)}
  #memo .m.done{opacity:.4;text-decoration:line-through}
  #regMemo{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*62);z-index:5;pointer-events:none;display:none;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*0.8);text-shadow:0 2px 8px #000}
  #regMemo.on{display:flex}
  #regMemo small{font-size:calc(var(--u)*3);letter-spacing:.1em;opacity:.8}
  #regMemo .m{display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*0.5) calc(var(--u)*2);border-radius:calc(var(--u)*3);background:rgba(8,10,14,.72);border:1px solid rgba(255,255,255,.18);font-size:calc(var(--u)*3.6);font-weight:700;font-variant-numeric:tabular-nums}
  #regMemo .m i{width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;display:block;border:1px solid rgba(255,255,255,.5)}
  #speech{position:absolute;left:50%;top:calc(var(--u)*46);transform:translate(-50%,-100%);z-index:6;width:max-content;max-width:94%;padding:calc(var(--u)*2.2) calc(var(--u)*3.6);white-space:pre;line-height:1.35;
    border-radius:calc(var(--u)*4);background:#fffdf5;color:#222;font-size:calc(var(--u)*4.4);font-weight:700;letter-spacing:.03em;text-align:center;
    opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  #speech.on{opacity:1}
  #speech::after{content:"";position:absolute;left:var(--tail,50%);bottom:calc(var(--u)*-2.2);margin-left:calc(var(--u)*-1.8);border:calc(var(--u)*1.8) solid transparent;border-top-color:#fffdf5;border-bottom:0}
  #chg{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;top:calc(var(--u)*100);z-index:5;pointer-events:none;display:none;padding:calc(var(--u)*0.8) calc(var(--u)*2.6);border-radius:calc(var(--u)*3);background:rgba(120,70,10,.82);border:1px solid rgba(255,190,90,.7);color:#ffe2b0;font-size:calc(var(--u)*3.8);font-weight:700;text-shadow:0 1px 4px #000}
  #chg.on{display:block}
  #pops{position:absolute;left:50%;top:calc(var(--u)*20);z-index:6;pointer-events:none}
  .pop{position:absolute;left:0;transform:translateX(-50%);font-size:calc(var(--u)*6.5);font-weight:900;white-space:nowrap;text-shadow:0 2px 8px #000;animation:floatUp 1s ease-out forwards}
  .pop.plus{color:#7ee08c} .pop.minus{color:#ff7b6b}
  @keyframes floatUp{0%{opacity:0;margin-top:calc(var(--u)*3)}15%{opacity:1}100%{opacity:0;margin-top:calc(var(--u)*-8)}}
  #result{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);background:rgba(6,8,12,.92);text-align:center}
  #result.on{display:flex}
  #result h2{font-size:calc(var(--u)*6);letter-spacing:.2em;font-weight:700}
  #resStars{font-size:calc(var(--u)*11);color:var(--amber);letter-spacing:.1em;display:flex;gap:calc(var(--u)*1.5)}
  #resStars span{display:block;opacity:.18;transform:scale(.4)}
  #resStars span.lit{opacity:1;animation:starIn .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d,0s);text-shadow:0 0 18px rgba(255,170,50,.8)}
  @keyframes starIn{0%{opacity:0;transform:scale(2.4) rotate(-40deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  .rise{animation:rankIn .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s)}
  @keyframes rankIn{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
  .fade{animation:fadeIn .8s ease-out both;animation-delay:var(--d,0s)}
  @keyframes fadeIn{0%{opacity:0;transform:translateY(calc(var(--u)*2))}100%{opacity:1;transform:none}}
  #resRank{font-size:calc(var(--u)*26);font-weight:900;color:var(--amber);line-height:1;text-shadow:0 0 24px rgba(255,170,50,.6)}
  #resScoreRow{font-size:calc(var(--u)*5.5)} #resScore{font-size:calc(var(--u)*9);font-weight:700;color:var(--amber)}
  #resTitle{font-size:calc(var(--u)*5.6);padding:0 calc(var(--u)*6)}
  #retry{margin-top:calc(var(--u)*4);padding:calc(var(--u)*3.5) calc(var(--u)*12);border:2px solid #aab3c2;border-radius:calc(var(--u)*4);background:linear-gradient(#3b4252,#252a34);color:var(--ink);font-size:calc(var(--u)*5.6);font-weight:700;letter-spacing:.2em}
  #retry:active{transform:translateY(2px)}

  /* ---- スタート画面 ---- */
  #title{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);background:rgba(6,8,12,.62);text-align:center;padding:0 calc(var(--u)*6)}
  #title.on{display:flex}
  #title h1{font-size:calc(var(--u)*9.5);letter-spacing:.14em;color:var(--amber);text-shadow:0 0 22px rgba(255,170,50,.6);font-weight:900}
  #title .sub{font-size:calc(var(--u)*4);opacity:.85;letter-spacing:.1em}
  #title .how{font-size:calc(var(--u)*4.4);line-height:1.7;padding:calc(var(--u)*3.5) calc(var(--u)*5);border-radius:calc(var(--u)*4);background:rgba(8,10,14,.72);border:1px solid rgba(255,255,255,.2)}
  #title .how b{color:var(--amber);letter-spacing:.2em}
  #title .how small{display:block;margin-top:calc(var(--u)*1.5);font-size:calc(var(--u)*3.4);opacity:.85;line-height:1.6}
  #startBtn{margin-top:calc(var(--u)*3);padding:calc(var(--u)*4) calc(var(--u)*16);border:2px solid var(--amber);border-radius:calc(var(--u)*4);background:linear-gradient(#6b4a1c,#3a2810);color:var(--amber);font-size:calc(var(--u)*6.5);font-weight:900;letter-spacing:.3em;box-shadow:0 0 18px rgba(255,170,50,.5);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 30px rgba(255,170,50,.9)}}
  /* ---- Phase 4：エンディングの暗転・「本日の勤務終了」 ---- */
  #dim{position:absolute;left:0;right:0;top:0;height:62%;z-index:3;background:#000;opacity:0;pointer-events:none}
  #endBanner{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(244,244,240,.94);color:#22232a;font-size:calc(var(--u)*8.5);font-weight:700;letter-spacing:.2em;opacity:0;pointer-events:none;transition:opacity 1s}
  #endBanner.on{opacity:1}

  /* ---- 到着フラッシュ ---- */
  #flash{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;background:#fff;opacity:0;pointer-events:none}

  /* ---- スマホ横向きの案内（縦専用） ---- */
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:#0b0e14}
  #rotate .phone{width:46px;height:80px;border:4px solid var(--ink);border-radius:9px;position:relative;animation:turn 2.4s ease-in-out infinite}
  @keyframes turn{0%,25%{transform:rotate(-90deg)}55%,85%{transform:rotate(0)}100%{transform:rotate(-90deg)}}
  #rotate p{font-size:20px;letter-spacing:.1em;line-height:1.8}
  @media (orientation: landscape) and (pointer: coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <div id="view"></div>
  <div id="flash"></div>
  <div id="dim"></div>
  <div id="top"><div id="cur">現在階：<b id="curN">1F</b><span id="arrow"></span></div></div>
  <div id="msg"></div>
  <div class="stat" id="statL"><small>SCORE</small><b id="scoreN">0</b></div>
  <div class="stat" id="statR"><small>残り</small><b id="leftN">12</b><small style="display:inline"> 組</small></div>
  <div id="memo"></div>
  <div id="chg"></div>
  <div id="regMemo"></div>
  <div id="speech"></div>
  <div id="pops"></div>
  <div id="endBanner"></div>
  <div id="title"><h1>エレベーター係</h1><p class="sub">ボタンを押すだけの、かんたんなお仕事</p>
    <div class="how"><b>遊び方</b><br>客の注文を聞いて、<br>階数ボタンを押して<br>目的階へ案内しよう<small>スマホ：ボタンをタップ<br>PC：数字キー（0＝10F、B＝地下1階、N＝地下2階）</small></div>
    <button id="startBtn">スタート</button></div>
  <div id="result">
    <h2 id="resHead">本日の勤務終了</h2>
    <div id="resStars"></div>
    <div id="resRank"></div>
    <div id="resTitle"></div>
    <div id="resScoreRow">スコア <span id="resScore">0</span></div>
    <button id="retry">もう一度</button>
  </div>
  <div id="panel">
    <div id="grid"></div>
  </div>
</div>
<div id="rotate"><div class="phone"></div><p>縦画面にしてください</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
